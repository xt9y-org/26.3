plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
repositories {
    maven { name = 'CurseMaven'; url = 'https://www.cursemaven.com' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
}
def bundleEngines = !providers.gradleProperty('xt9yDisableEngines').isPresent()
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "curse.maven:fabric-gui-imgui-1423038:8991300"
    include "curse.maven:fabric-gui-imgui-1423038:8991300"
    compileOnly "io.github.spair:imgui-java-binding:1.92.7.1"

    if (bundleEngines) {
    // Lossless-targeting engine optimizations. Pin specific 26.3 Fabric releases.
    // Keep each upstream mod as its own nested JAR with its own metadata,
    // mixins, license and independent update path; never merge class files.
    // Diagnostic isolation: do not suppress C2ME in the normal release build.
    if (!providers.gradleProperty('xt9yDisableC2ME').isPresent()) {
        implementation "maven.modrinth:VSNURh3q:cfKRtp0m" // C2ME
        include        "maven.modrinth:VSNURh3q:cfKRtp0m"
    }
    implementation    "maven.modrinth:Ps1zyz6x:g4eqNSKd" // ScalableLux: skylight/blocklight
    include        "maven.modrinth:Ps1zyz6x:g4eqNSKd"
    implementation    "maven.modrinth:gvQqBUqZ:xS0Q8LSi" // Lithium: entity/game logic
    include        "maven.modrinth:gvQqBUqZ:xS0Q8LSi"
    implementation    "maven.modrinth:5ZwdcRci:3MP9UR23" // ImmediatelyFast: client rendering
    include        "maven.modrinth:5ZwdcRci:3MP9UR23"
    implementation "maven.modrinth:AtOSAunf:nmIzJcIn" // OBE: block entity meshing/rendering
    include        "maven.modrinth:AtOSAunf:nmIzJcIn"
    implementation    "maven.modrinth:c2DHmFvV:UhO60CKq" // Ferrite: JNI entity/collision hot paths
    include        "maven.modrinth:c2DHmFvV:UhO60CKq"
    implementation "maven.modrinth:uXXizFIs:d5ddUdiB" // FerriteCore: memory footprint
    include        "maven.modrinth:uXXizFIs:d5ddUdiB"
    implementation "maven.modrinth:TjSm1wrD:iKbywnU7" // ModernFix-mVUS: game init / memory / loading
    include        "maven.modrinth:TjSm1wrD:iKbywnU7"
    }
}
// Compile and embed the native library automatically for the build machine.
def platformName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def platformArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def nativeOS = platformName.contains('mac') ? 'macos' :
        platformName.contains('win') ? 'windows' : 'linux'
def nativeArch = platformArch in ['arm64', 'aarch64'] ? 'aarch64' : 'x86_64'
def nativeFilename = nativeOS == 'windows' ? 'xt9y263.dll' :
        nativeOS == 'macos' ? 'libxt9y263.dylib' : 'libxt9y263.so'
def nativeSource = layout.projectDirectory.file("rust/target/release/${nativeFilename}")

tasks.register('compileNative', Exec) {
    workingDir = layout.projectDirectory.dir('rust').asFile
    commandLine 'cargo', 'build', '--release'
    inputs.files(fileTree('rust/src'), file('rust/Cargo.toml'))
    outputs.file(nativeSource)
}
tasks.register('stageNative', Sync) {
    dependsOn tasks.named('compileNative')
    from(nativeSource)
    into(layout.buildDirectory.dir("generated/native/natives/${nativeOS}-${nativeArch}"))
}

def modVersion = version.toString()
processResources {
    dependsOn tasks.named('stageNative')
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    from(layout.buildDirectory.dir('generated/native'))
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
