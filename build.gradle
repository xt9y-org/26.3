plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
repositories {
    maven { name = 'CurseMaven'; url = 'https://www.cursemaven.com' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "curse.maven:fabric-gui-imgui-1423038:8991300"
    include "curse.maven:fabric-gui-imgui-1423038:8991300"
    compileOnly "io.github.spair:imgui-java-binding:1.92.7.1"
}
// Compile and embed the native library automatically for the build machine.
def platformName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def platformArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def nativeOS = platformName.contains('mac') ? 'macos' :
        platformName.contains('win') ? 'windows' : 'linux'
def nativeArch = platformArch in ['arm64', 'aarch64'] ? 'aarch64' : 'x86_64'
def nativeFilename = nativeOS == 'windows' ? 'xt9y263.dll' :
        nativeOS == 'macos' ? 'libxt9y263.dylib' : 'libxt9y263.so'
def nativeSource = layout.projectDirectory.file("rust/target/release/${nativeFilename}")

tasks.register('compileNative', Exec) {
    workingDir = layout.projectDirectory.dir('rust').asFile
    commandLine 'cargo', 'build', '--release'
    inputs.files(fileTree('rust/src'), file('rust/Cargo.toml'))
    outputs.file(nativeSource)
}
tasks.register('stageNative', Sync) {
    dependsOn tasks.named('compileNative')
    from(nativeSource)
    into(layout.buildDirectory.dir("generated/native/natives/${nativeOS}-${nativeArch}"))
}

def modVersion = version.toString()
processResources {
    dependsOn tasks.named('stageNative')
    // Source is bundled for LGPL recipients: no separate performance mod download.
    from('src/main/java/dev/xt9y/perf/mixin/randomtick') {
        include 'LevelMixin.java', 'ServerLevelMixin.java'
        into 'META-INF/sources/xt9y-chunk-random/mixins'
    }
    from('src/main/java/dev/xt9y/perf/engine/randomtick') {
        include '*.java'
        into 'META-INF/sources/xt9y-chunk-random'
    }
    from('src/main/java/dev/xt9y/perf/mixin/rendering') {
        include '*.java'
        into 'META-INF/sources/xt9y-rendering'
    }
    from('src/main/java/dev/xt9y/perf/mixin/worldgen') {
        include '*.java'
        into 'META-INF/sources/xt9y-engine-hotpaths/worldgen'
    }
    from('src/main/java/dev/xt9y/perf/mixin/hotpath') {
        include '*.java'
        into 'META-INF/sources/xt9y-engine-hotpaths/hotpath'
    }
    from(layout.buildDirectory.dir('generated/native'))
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
