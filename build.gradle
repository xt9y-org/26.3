plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
repositories {
    maven { name = 'CurseMaven'; url = 'https://www.cursemaven.com' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "curse.maven:fabric-gui-imgui-1423038:8991300"
    include "curse.maven:fabric-gui-imgui-1423038:8991300"
    compileOnly "io.github.spair:imgui-java-binding:1.92.7.1"
}
def modVersion = version.toString()
processResources {
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
