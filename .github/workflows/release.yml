name: Universal Fabric release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: fabric-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: windows-x86_64
            runner: windows-2025
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - run: cargo test --manifest-path rust/Cargo.toml
      - name: Compile Fabric with Rust native library
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            "0.2.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          gradle build "-Pversion=$version" --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage platform JAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $jars = @(Get-ChildItem build/libs -Filter '*.jar' -File |
            Where-Object { $_.Name -notmatch '(-sources|-dev|-javadoc|-all)\.jar$' })
          if ($jars.Count -ne 1) { throw "Expected one Fabric JAR: $($jars.Name)" }
          Copy-Item $jars[0].FullName "dist/fabric.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.platform }}
          path: dist/fabric.jar
          if-no-files-found: error

  publish:
    name: Publish one universal Fabric JAR
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          path: packages
      - name: Assemble native binaries into universal JAR
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="$GITHUB_REF_NAME";
          else VERSION="dev-$GITHUB_RUN_NUMBER"; fi
          python3 scripts/assemble_release.py --input-root packages --output dist --version "$VERSION"
          test "$(find dist -name '*.jar' | wc -l)" -eq 1
          python3 scripts/check_bundle.py dist/*.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.jar
            dist/SHA256SUMS.txt
