name: Universal Fabric release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable major version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      confirm_publish:
        description: 'Type RELEASE to publish a stable version from main'
        required: true
        default: 'NO'
        type: string

permissions:
  contents: write

concurrency:
  group: fabric-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version and release intent
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested stable release or development build
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$TARGET_REF" == "refs/heads/main" ]] || {
              echo "::error::A stable release must be built from main"; exit 1;
            }
            [[ "$CONFIRM_PUBLISH" == "RELEASE" ]] || {
              echo "::error::Set confirm_publish to RELEASE for a stable major release"; exit 1;
            }
            [[ "$REQUESTED_VERSION" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Expected a nonzero-major semantic version such as 1.0.0"; exit 1;
            }
            tag="v${REQUESTED_VERSION}"
            if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
              echo "::error::Release tag ${tag} already exists"; exit 1
            fi
            echo "version=${REQUESTED_VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Stable release candidate: ${tag}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "version=0.2.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: windows-x86_64
            runner: windows-2025
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Compile versioned Fabric JAR and native library
        shell: pwsh
        env:
          XT9Y_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gradle build "-Pversion=$env:XT9Y_RELEASE_VERSION" --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage one platform JAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $jars = @(Get-ChildItem build/libs -Filter '*.jar' -File |
            Where-Object { $_.Name -notmatch '(-sources|-dev|-javadoc|-all)\.jar$' })
          if ($jars.Count -ne 1) { throw "Expected one Fabric JAR: $($jars.Name)" }
          Copy-Item $jars[0].FullName "dist/fabric.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.platform }}
          path: dist/fabric.jar
          if-no-files-found: error

  verify-release:
    name: Verify stable release candidate in real Minecraft
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Python package, licensing and benchmark unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build the exact release-version Java and native code
        env:
          XT9Y_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: gradle build "-Pversion=${XT9Y_RELEASE_VERSION}" --no-daemon
      - name: Validate mod manifest, mixins and redistributed source
        env:
          XT9Y_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/check_release_candidate.py --build-dir build/libs --version "$XT9Y_RELEASE_VERSION"
      - name: Server block-state, shape and random-tick correctness
        run: |
          XT9Y_TEST_BLOCKSTATES=1 bash scripts/smoke_server.sh
          grep -q 'BlockState oracle passed' run/xt9y263-smoke.log
          XT9Y_TEST_SHAPE_CACHE=1 bash scripts/smoke_server.sh
          grep -q 'Shape cache oracle passed' run/xt9y263-smoke.log
          XT9Y_TEST_CHUNK_RANDOM=1 bash scripts/smoke_server.sh
          grep -q 'Random chunk tick oracle passed: 32768 exact positions' run/xt9y263-smoke.log
      - name: Actual Minecraft lighting parity
        run: bash scripts/test_lighting_parity.sh
      - name: Actual Minecraft worldgen and AI navigation parity
        run: bash scripts/test_engine_parity.sh
      - name: Install Mesa software OpenGL and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 mesa-utils
      - name: Optimized and baseline client boot and rendered-frame smoke
        run: |
          bash scripts/smoke_client.sh
          XT9Y_PERF_BASELINE=1 bash scripts/smoke_client.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: major-release-verification-logs
          path: |
            run/xt9y-light-baseline.log
            run/xt9y-light-optimized.log
            run/xt9y-hotpaths-baseline.log
            run/xt9y-hotpaths-optimized.log
            run/xt9y263-smoke.log
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: ignore

  publish:
    name: Publish a single universal Fabric JAR
    needs: [prepare, build, verify-release]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.verify-release.result == 'success' ||
       (needs.prepare.outputs.publish != 'true' && needs.verify-release.result == 'skipped'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          path: packages
      - name: Assemble platform binaries into a universal Fabric archive
        env:
          XT9Y_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/assemble_release.py --input-root packages --output dist --version "$XT9Y_RELEASE_VERSION"
          test "$(find dist -name '*.jar' | wc -l)" -eq 1
          python3 scripts/check_release_candidate.py --build-dir dist --version "$XT9Y_RELEASE_VERSION" --universal
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish stable major release or development prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.publish != 'true' }}
          make_latest: ${{ needs.prepare.outputs.publish == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.jar
            dist/SHA256SUMS.txt
