name: TEST
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - run: gradle build --no-daemon
      - name: Boot Minecraft and verify all vanilla blockstate transitions
        run: |
          XT9Y_TEST_BLOCKSTATES=1 bash scripts/smoke_server.sh
          grep -q 'BlockState oracle passed' run/xt9y263-smoke.log
      - name: Verify identical blockstate semantics with optimization mixins disabled
        run: |
          XT9Y_PERF_BASELINE=1 XT9Y_TEST_BLOCKSTATES=1 bash scripts/smoke_server.sh
          grep -q 'BlockState oracle passed' run/xt9y263-smoke.log
          grep -q 'baseline: true' run/xt9y263-smoke.log
      - name: Verify shape-cache results match the vanilla boolean shape predicate
        run: |
          XT9Y_TEST_SHAPE_CACHE=1 bash scripts/smoke_server.sh
          grep -q 'Shape cache oracle passed' run/xt9y263-smoke.log
      - name: Verify shape oracle against vanilla with optimization disabled
        run: |
          XT9Y_TEST_SHAPE_CACHE=1 XT9Y_PERF_BASELINE=1 bash scripts/smoke_server.sh
          grep -q 'Shape cache oracle passed' run/xt9y263-smoke.log
      - name: Verify optimized chunk random tick coordinates and RNG against vanilla
        run: |
          XT9Y_TEST_CHUNK_RANDOM=1 bash scripts/smoke_server.sh
          grep -q 'Random chunk tick oracle passed: 32768 exact positions' run/xt9y263-smoke.log

  lighting:
    name: Minecraft 26.3 block and sky light parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Record vanilla light propagation, same world seed
        run: |
          XT9Y_TEST_LIGHT_ORACLE=1 XT9Y_PERF_BASELINE=1 XT9Y263_PARITY=1 bash scripts/smoke_server.sh
          cp run/xt9y263-smoke.log baseline-light.log
          rm -rf run/world
      - name: Record optimized light propagation
        run: XT9Y_TEST_LIGHT_ORACLE=1 XT9Y263_PARITY=1 bash scripts/smoke_server.sh
      - name: Assert exactly identical block and skylight values
        run: python3 scripts/check_lighting.py baseline-light.log run/xt9y263-smoke.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: light-parity-logs
          path: |
            baseline-light.log
            run/xt9y263-smoke.log
          if-no-files-found: ignore
