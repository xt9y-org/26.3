name: TEST
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - run: gradle build --no-daemon
      - name: Verify six actual bundled performance engines
        run: python3 scripts/check_bundle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-stack-binary
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: ignore
      - name: Boot Minecraft server and verify mod compatibility
        run: bash scripts/smoke_server.sh

  parity:
    name: Vanilla vs optimized terrain and lighting
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Generate seed 73452981 using baseline Fabric + vanilla engines
        run: XT9Y263_PARITY=1 bash scripts/smoke_server.sh -Pxt9yDisableEngines=true
      - name: Preserve baseline Anvil world
        shell: bash
        run: |
          set -euo pipefail
          echo "Discovering Minecraft world directories:"
          find . -maxdepth 8 -name level.dat -type f -print
          save_file="$(find . -maxdepth 8 -name level.dat -type f | head -n 1)"
          test -n "$save_file"
          save_dir="$(dirname "$save_file")"
          echo "Backing up vanilla test world: $save_dir"
          cp run/xt9y263-smoke.log baseline-smoke.log
          mv "$save_dir" baseline-world
      - name: Generate identical seed using six optimized engines
        run: XT9Y263_PARITY=1 bash scripts/smoke_server.sh
      - name: Verify lossless block, biome, heightmap and lighting output
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated worlds:"
          find . -maxdepth 8 -name level.dat -type f -print
          save_file="$(find . -maxdepth 8 -name level.dat -type f ! -path './baseline-world/*' | head -n 1)"
          test -n "$save_file"
          echo "Baseline save files:"
          find baseline-world -maxdepth 5 -type f | head -n 120
          echo "Optimized save files:"
          find "$(dirname "$save_file")" -maxdepth 5 -type f | head -n 120
          python3 scripts/world_fingerprint.py baseline-world "$(dirname "$save_file")" --minimum 8
          python3 scripts/performance_summary.py baseline-smoke.log run/xt9y263-smoke.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: world-parity-logs
          path: |
            run/xt9y263-smoke.log
            baseline-world/dimensions/minecraft/overworld/region/
            baseline-world/level.dat
            run/world/dimensions/minecraft/overworld/region/
            run/world/level.dat
          if-no-files-found: ignore
