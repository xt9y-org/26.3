name: TEST
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - run: gradle build --no-daemon
      - name: Boot Minecraft and verify all vanilla blockstate transitions
        run: |
          XT9Y_TEST_BLOCKSTATES=1 bash scripts/smoke_server.sh
          grep -q 'BlockState oracle passed' run/xt9y263-smoke.log
      - name: Verify identical blockstate semantics with optimization mixins disabled
        run: |
          XT9Y_PERF_BASELINE=1 XT9Y_TEST_BLOCKSTATES=1 bash scripts/smoke_server.sh
          grep -q 'BlockState oracle passed' run/xt9y263-smoke.log
          grep -q 'baseline: true' run/xt9y263-smoke.log
      - name: Verify shape-cache results match the vanilla boolean shape predicate
        run: |
          XT9Y_TEST_SHAPE_CACHE=1 bash scripts/smoke_server.sh
          grep -q 'Shape cache oracle passed' run/xt9y263-smoke.log
      - name: Verify shape oracle against vanilla with optimization disabled
        run: |
          XT9Y_TEST_SHAPE_CACHE=1 XT9Y_PERF_BASELINE=1 bash scripts/smoke_server.sh
          grep -q 'Shape cache oracle passed' run/xt9y263-smoke.log
      - name: Verify optimized chunk random tick coordinates and RNG against vanilla
        run: |
          XT9Y_TEST_CHUNK_RANDOM=1 bash scripts/smoke_server.sh
          grep -q 'Random chunk tick oracle passed: 32768 exact positions' run/xt9y263-smoke.log

  benchmark:
    name: Actual Minecraft server A/B MSPT
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Baseline Minecraft server, seed 73452981
        run: |
          XT9Y_TPS_BENCH=1 XT9Y_BENCH_SECONDS=60 XT9Y_PERF_BASELINE=1 XT9Y263_PARITY=1 bash scripts/smoke_server.sh
          cp run/xt9y263-smoke.log baseline.log
          rm -rf run/world
      - name: Optimized Minecraft server, identical forced-chunk workload
        run: XT9Y_TPS_BENCH=1 XT9Y_BENCH_SECONDS=60 XT9Y263_PARITY=1 bash scripts/smoke_server.sh
      - name: Report actual tick-time distributions
        run: |
          set -euo pipefail
          grep -q 'XT9Y_TPS_BENCH count=' baseline.log
          grep -q 'XT9Y_TPS_BENCH count=' run/xt9y263-smoke.log
          python3 scripts/compare_tick_bench.py baseline.log run/xt9y263-smoke.log | tee benchmark.md
          cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-real-mspt
          path: |
            baseline.log
            run/xt9y263-smoke.log
            benchmark.md
          if-no-files-found: ignore
