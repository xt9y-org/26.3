name: TEST
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - run: gradle build --no-daemon
      - name: Verify actual rendered JAR includes GPL notices and client mixin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from scripts.check_render_bundle import verify
          from scripts.check_release_candidate import find_jar
          verify(find_jar(Path("build/libs")))
          PY
      - name: Boot Minecraft and verify all vanilla blockstate transitions
        run: |
          XT9Y_TEST_BLOCKSTATES=1 bash scripts/smoke_server.sh
          grep -q 'BlockState oracle passed' run/xt9y263-smoke.log
      - name: Verify identical blockstate semantics with optimization mixins disabled
        run: |
          XT9Y_PERF_BASELINE=1 XT9Y_TEST_BLOCKSTATES=1 bash scripts/smoke_server.sh
          grep -q 'BlockState oracle passed' run/xt9y263-smoke.log
          grep -q 'baseline: true' run/xt9y263-smoke.log
      - name: Verify shape-cache results match the vanilla boolean shape predicate
        run: |
          XT9Y_TEST_SHAPE_CACHE=1 bash scripts/smoke_server.sh
          grep -q 'Shape cache oracle passed' run/xt9y263-smoke.log
      - name: Verify shape oracle against vanilla with optimization disabled
        run: |
          XT9Y_TEST_SHAPE_CACHE=1 XT9Y_PERF_BASELINE=1 bash scripts/smoke_server.sh
          grep -q 'Shape cache oracle passed' run/xt9y263-smoke.log
      - name: Verify optimized chunk random tick coordinates and RNG against vanilla
        run: |
          XT9Y_TEST_CHUNK_RANDOM=1 bash scripts/smoke_server.sh
          grep -q 'Random chunk tick oracle passed: 32768 exact positions' run/xt9y263-smoke.log

  lighting:
    name: Minecraft 26.3 block and sky light parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Compare real Minecraft lighting across isolated worlds
        run: bash scripts/test_lighting_parity.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: light-parity-logs
          path: |
            run/xt9y-light-baseline.log
            run/xt9y-light-optimized.log
            run/xt9y263-smoke.log
          if-no-files-found: ignore

  graphical-client:
    name: Minecraft 26.3 optimized/baseline software-GL client smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Install headless OpenGL software renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 mesa-utils
      - name: Boot actual graphical client and render a complete frame
        run: bash scripts/smoke_client.sh
      - name: Reboot client with optimization disabled, validate baseline
        run: XT9Y_PERF_BASELINE=1 bash scripts/smoke_client.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: graphical-client-logs
          path: |
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: ignore

  benchmark:
    name: Actual Minecraft server A/B MSPT
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Measure and report actual isolated-world server MSPT
        run: bash scripts/test_tick_benchmark.sh | tee benchmark.md
      - name: Add benchmark to run summary
        run: cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-real-mspt
          path: |
            run/xt9y-mspt-baseline.log
            run/xt9y-mspt-optimized.log
            run/xt9y263-smoke.log
            benchmark.md
          if-no-files-found: ignore

  engine-parity:
    name: Source-level worldgen and pathfinding parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Run isolated seeded-world and pathfinding A/B test
        run: bash scripts/test_engine_parity.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: engine-parity-logs
          path: |
            run/xt9y-hotpaths-baseline.log
            run/xt9y-hotpaths-optimized.log
            run/xt9y263-smoke.log
          if-no-files-found: ignore
