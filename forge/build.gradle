// Separate Minecraft 26.3 Forge frontend sharing the Fabric mod's Rust backend.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.40'
}
group = 'dev.xt9y'
version = findProperty('modVersion') ?: '0.1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach { workingDir = layout.projectDirectory.dir('run') }
        register('client')
        register('server') { args '--nogui' }
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.10')
}

// Compile one common JNI bridge on both loaders (avoids duplicate Java/Rust ABI).
def commonSource = layout.buildDirectory.dir('generated/common-source')
tasks.register('stageSharedBridge', Sync) {
    from('../src/main/java/dev/xt9y/perf/NativeBridge.java')
    into(commonSource.map { it.dir('dev/xt9y/perf') })
}
sourceSets.main.java.srcDir commonSource
tasks.named('compileJava') { dependsOn tasks.named('stageSharedBridge') }

def modVersion = version.toString()
tasks.named('processResources') {
    inputs.property 'version', modVersion
    filesMatching('META-INF/mods.toml') { expand version: modVersion }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
